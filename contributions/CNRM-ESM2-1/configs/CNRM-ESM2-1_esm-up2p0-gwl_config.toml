[inputs]
# === Define dimensions in dictionary format === #
# (i.e., { time = "time_counter", i = "x", j = "y"} where the
# key is the standard CMORISED dimension name and the value is the
# corresponding dimension name in all input datasets).
dimensions = { time = "time", x = "i", y = "j" }

# === Define data directory === #
# Data directory for all input datasets to be optionally substituted in filepaths below:
# (i.e., any instance of "{data_dir}" in filepaths below will be replaced with the value specified here).
data_dir = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/data/CNRM-ESM2-1/esm-up2p0-gwl5p0/r1i1p2f2/SImon"

    [inputs.mask]
    # === Define variable name & filepath of regional mask to perform sea ice mass budget === #
    name = "mask_SH"
    filepath = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/data/CNRM-ESM2-1/Ofx/hemisphere_masks_Ofx_CNRM-ESM2-1.nc"

    [inputs.areacello]
    # === Define variable name & filepath of horizontal grid cell area (areacello) === #
    name = "areacello"
    filepath = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/data/CNRM-ESM2-1/Ofx/areacello_Ofx_CNRM-ESM2-1.nc"

    [inputs.siconc]
    # === Define variable name & filepath of sea ice concentration (siconc) === #
    name = "siconc"
    filepath = "{data_dir}/siconc/gn/siconc_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    [inputs.sivol]
    # === Define variable name & filepath of sea ice volume (thickness) (sivol) === #
    name = "sivol"
    filepath = "{data_dir}/sivol/gn/sivol_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    [inputs.simass]
    # === Define variable name & filepath of sea ice mass (simass) === #
    name = "simass"
    filepath = "{data_dir}/simass/gn/simass_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    [inputs.sidmassth]
    # === Define variable name & filepath of sea ice mass change from thermodynamics (sidmassth) === #
    name = "sidmassth"
    filepath = "{data_dir}/sidmassth/gn/sidmassth_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    [inputs.sidmassdyn]
    # === Define variable name & filepath of sea ice mass change from dynamics (sidmassdyn) === #
    name = "sidmassdyn"
    filepath = "{data_dir}/sidmassdyn/gn/sidmassdyn_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    # [inputs.sidmassgrowthwat]
    # === Define variable name & filepath of sea ice mass change through growth in supercooled open water (a.k.a. frazil) (sidmassgrowthwat) === #
    # name = "sidmassgrowthwat"
    # filepath = "{data_dir}/sidmassgrowthwat/gn/sidmassgrowthwat_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    # [inputs.sidmassgrowthbot]
    # === Define variable name & filepath of sea ice mass change through basal growth (sidmassgrowthbot) === #
    # name = "sidmassgrowthbot"
    # filepath = "{data_dir}/sidmassgrowthbot/gn/sidmassgrowthbot_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    # [inputs.sidmasssi]
    # === Define variable name & filepath of sea ice mass change through snow-to-ice conversion (sidmasssi) === #
    # name = "sidmasssi"
    # filepath = "{data_dir}/sidmasssi/gn/sidmasssi_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    [inputs.sidmassevapsubl]
    # === Define variable name & filepath of sea ice mass change through evaporation and sublimation (sidmassevapsubl) === #
    name = "sidmassevapsubl"
    filepath = "{data_dir}/sidmassevapsubl/gn/sidmassevapsubl_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    [inputs.sidmassmelttop]
    # === Define variable name & filepath of sea ice mass change through surface melting (sidmassmelttop) === #
    name = "sidmassmelttop"
    filepath = "{data_dir}/sidmassmelttop/gn/sidmassmelttop_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    [inputs.sidmassmeltbot]
    # === Define variable name & filepath of sea ice mass change through bottom melting (sidmassmeltbot) === #
    name = "sidmassmeltbot"
    filepath = "{data_dir}/sidmassmeltbot/gn/sidmassmeltbot_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

    # [inputs.sidmasslat]
    # === Define variable name & filepath of sea ice mass change through lateral melting (sidmasslat) === #
    # name = "sidmasslat"
    # filepath = "{data_dir}/sidmasslat/gn/sidmasslat_SImon_CNRM-ESM2-1_02Kpd-50_r1i1p2f2_gn_*.nc"

[outputs]
# Define Sea Ice Mass Budget Analysis netCDF output file:
output_dir = "/g100_work/optim_IAC/research/noc/otooth/OptimESM/WP5/SeaIceMassBudgetMIP/contributions/CNRM-ESM2-1/outputs/"
# output_name = "CNRM-ESM2-1_SIMBA_NH_esm-up2p0-gwl5p0_r1i1p2f2"
output_name = "CNRM-ESM2-1_SIMBA_SH_esm-up2p0-gwl5p0_r1i1p2f2"
date_format = "M"